<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黃誠祐｜抓周預測</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#635044;background:#faf4eb}*{box-sizing:border-box}body{margin:0}main{max-width:540px;margin:auto;padding:30px 18px 60px}.card{background:#fffdf9;border:1px solid #e9d9c8;border-radius:24px;padding:25px;box-shadow:0 10px 35px #947b6420;margin:18px 0}.eyebrow{text-align:center;letter-spacing:3px;color:#a48769}h1{text-align:center;font-size:32px;margin:10px 0;color:#89664d}h2{font-size:21px;color:#8d6d56}p{line-height:1.7}.subtitle{text-align:center;color:#947e6a}.badge{background:#f2e5d7;color:#856b56;border-radius:30px;padding:9px 16px;display:inline-block}.center{text-align:center}.icon{font-size:58px;text-align:center;margin:18px}label{display:block;margin:15px 0 8px;font-weight:600}input,select,button{width:100%;border-radius:13px;font:inherit;padding:14px;border:1px solid #d9c6b3;background:#fff}button{background:#b78f6f;color:white;font-weight:700;border:0;margin-top:16px;cursor:pointer}button.secondary{background:#e8d9c9;color:#604c3e}button:disabled{opacity:.45}small{color:#967d6b}#notice{padding:10px;border-radius:12px;margin-top:12px;background:#f4eadd;display:none}.winner{font-size:25px;text-align:center;color:#aa7950;font-weight:bold;white-space:pre-wrap}.foot{text-align:center;font-size:12px;color:#967e6d}details summary{cursor:pointer;font-weight:700;color:#80624e}hr{border:0;border-top:1px solid #ecded0;margin:25px 0}
</style></head><body><main><div class="eyebrow">BABY'S FIRST BIRTHDAY</div><div class="icon">🧸</div><h1>黃誠祐 · 抓周預測</h1><p class="subtitle">猜猜寶貝會抓到什麼呢？<br>猜對的親友，就有機會抽中幸運好禮 ♡</p><div class="center"><span class="badge">2027 · 幸福抓周派對</span></div><section class="card"><h2>🎀 我要參加預測</h2><p>每位親友限登記一次。抓周前記得送出答案！</p><label for="name">您的稱呼</label><input id="name" maxlength="30" placeholder="例如：小美阿姨"><label for="guess">預測寶寶會抓到的物品</label><select id="guess"></select><button id="submit">送出我的預測 ♡</button><div id="notice" role="status"></div><small>此版本為單機示範，資料僅保存在目前這台裝置。</small></section><section class="card"><details><summary>🔐 主辦人操作區（示範）</summary><p><small>正式上線前需連接資料庫並設定安全的管理員權限；目前僅供流程測試。</small></p><p id="status"></p><button class="secondary" id="close">截止／重新開放預測</button><label for="actual">寶寶實際抓到的物品</label><select id="actual"></select><button id="draw">從猜對的人中抽出 1 位得主</button><p id="count"></p><div id="winner" class="winner"></div><hr><button class="secondary" id="reset">清除本機示範資料</button></details></section><p class="foot">Made with love for 誠祐 ♡</p></main> <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase , ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
  const firebaseConfig = {
  apiKey: "AIzaSyAZqvCCXThWxqt5NMycqIkcXz7sh481buo",
  authDomain: "baby-zhua-zhou-2027.firebaseapp.com",
  projectId: "baby-zhua-zhou-2027",
  databaseURL: "https://baby-zhua-zhou-2027-default-rtdb.firebaseio.com", 
  storageBucket: "baby-zhua-zhou-2027.firebasestorage.app",
  messagingSenderId: "1011408919627",
  appId: "1:1011408919627:web:45ad90dcd0cf94fe5f01ce",
  measurementId: "G-LNHZVSEZK5"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const items=['印章 🏛️','算盤 🧮','書本 📚','畫筆 🎨','聽診器 🩺','麥克風 🎤','足球 ⚽','積木 🧱','滑鼠 🖱️','鍋鏟 🍳','尺 📏','錢幣 🪙'];
const key='zhua-zhou-demo-2027';let state;try{state=JSON.parse(localStorage.getItem(key))||{closed:false,entries:[]}}catch{state={closed:false,entries:[]}};
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(state));
for(const id of ['guess','actual']){items.forEach((v,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=v;$(id).appendChild(o)})}
function refresh(){ $('status').textContent=state.closed?'目前狀態：已截止':'目前狀態：開放預測';$('count').textContent='本機示範登記：'+state.entries.length+' 人';$('submit').disabled=state.closed;$('close').textContent=state.closed?'重新開放預測':'截止預測';}
function notice(s){$('notice').textContent=s;$('notice').style.display='block'}
$('submit').onclick=()=>{const name=$('name').value.trim(),guess=$('guess').value;if(state.closed)return notice('預測已截止。');if(!name)return notice('請先輸入稱呼。');if(state.entries.some(e=>e.name===name))return notice('此稱呼已登記過，請勿重複送出。');state.entries.push({name,guess});save();refresh();notice('🎉 預測成功！祝你好運！');$('name').value=''};
$('close').onclick=()=>{state.closed=!state.closed;save();refresh()};
$('draw').onclick=()=>{if(!state.closed)return $('winner').textContent='請先截止預測。';const eligible=state.entries.filter(e=>e.guess===$('actual').value);if(!eligible.length)return $('winner').textContent='目前沒有猜對的參加者。';const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);const selected=eligible[bytes[0]%eligible.length];$('winner').textContent='🎊 恭喜 '+selected.name+' 🎊\n猜對 '+items[Number(selected.guess)]};
$('reset').onclick=()=>{if(confirm('確定清除這台裝置的所有示範資料？')){localStorage.removeItem(key);state={closed:false,entries:[]};$('winner').textContent='';refresh()}};refresh();

</script>
</body></html>
